name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set release version
        id: version
        run: |
          version=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' Cargo.toml)
          IFS=. read -r major minor patch <<< "$version"
          major=$((major + 1)); minor=0; patch=0
          version="$major.$minor.$patch"
          sed -i "s/^version = \"[0-9]*\.[0-9]*\.[0-9]*\"$/version = \"$version\"/" Cargo.toml
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main --tags
      - uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu
      - name: Install Skyline
        run: |
          cargo install --git https://github.com/jam1garner/cargo-skyline --force
          cargo-skyline skyline update-std
      - name: Build release NRO
        run: cargo-skyline skyline build --release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: target/aarch64-skyline-switch/release/libauto_unlock_chars.nro